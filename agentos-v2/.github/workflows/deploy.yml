name: AgentOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Import & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Verify core imports
        env:
          GEMINI_API_KEY: dummy-key-for-import-test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: |
          python -c "
          from database import Base, CodeSnippet, Improvement, User, ContextArtifact, ASTSymbol, ASTEdge
          from tools import (
              execute_code, analyze_code, read_file, write_file,
              patch_file, list_directory, run_shell_command,
              web_search, scrape_page, search_algorithms,
              save_code_snippet, get_snippets, log_improvement,
              read_context_artifact, index_codebase_graph, get_symbol_blast_radius,
          )
          from ast_graph import ASTGraphIndexer, query_blast_radius
          from memory_manager import store_context_artifact, fetch_context_artifact, compact_conversation_window
          from agent import graph, AgentState
          from edge_router import EdgeRouteDecision, EdgeRouter, edge_router
          import main
          print('All imports OK')
          "

      - name: Verify graph compiles
        env:
          GEMINI_API_KEY: dummy-key-for-import-test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: |
          python -c "
          from langgraph.checkpoint.memory import MemorySaver
          from agent import graph
          app = graph.compile(checkpointer=MemorySaver())
          print('Graph compiled OK:', app)
          "

      - name: Run integration test suite & architecture benchmarks
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: |
          pytest -v test_auth_settings.py test_edge_router.py test_architecture.py
          python evals/benchmark_agentos.py

  # ── 2. Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentos:ci .

      - name: Quick container health check
        run: |
          docker run -d \
            --name agentos-ci \
            -e GEMINI_API_KEY=dummy \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e PORT=8080 \
            -p 8080:8080 \
            agentos:ci
          sleep 8
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/health || \
            (docker logs agentos-ci && exit 1)
          docker stop agentos-ci

  # ── 3. Deploy to Railway (main branch only) ─────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service agentos --detach

      - name: Verify deployment health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          DEPLOY_URL=$(railway status --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null || echo "")
          if [ -n "$DEPLOY_URL" ]; then
            echo "Checking $DEPLOY_URL/health ..."
            curl --fail --retry 8 --retry-delay 5 "$DEPLOY_URL/health"
          else
            echo "Could not determine deploy URL — check Railway dashboard manually."
          fi
