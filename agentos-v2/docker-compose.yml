version: "3.9"

services:
  agentos:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # SQLite persistence
      - .:/app                # Hot-reload source
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/agentos.db
      - PORT=8080
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
